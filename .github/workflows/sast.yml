name: SAST

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@a2983b8bed1923f44751c5c43237f479442827b3 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3 # v3

  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Ruleset
        run: semgrep scan --error --config p/owasp-top-ten --config p/javascript --config p/secrets
